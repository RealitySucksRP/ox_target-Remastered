<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="normal" />
  <style>html,body{background:transparent!important;color-scheme:normal!important}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="transparent" />
  <title>RS Orbital Target Interface</title>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="style.css?v=1.21.0" />
</head>
<body>
  <!-- Compact centered 3D orbital particle field (active only while targeting) -->
  <canvas id="rs-particles-canvas" width="380" height="380" aria-hidden="true"></canvas>

  <!-- Subtle radial spokes + active energy tether -->
  <svg id="target-branches" aria-hidden="true" preserveAspectRatio="none"></svg>
  <svg id="target-link" aria-hidden="true" preserveAspectRatio="none">
    <path id="link-glow"></path>
    <path id="link-line"></path>
  </svg>

  <!-- Compact 3D holographic ring & center eye reticle -->
  <div id="eye" aria-hidden="true">
    <span class="reticle-halo"></span>
    <span class="reticle-outer"></span>
    <span class="reticle-orbit orbit-a"></span>
    <span class="reticle-orbit orbit-b"></span>
    <span class="reticle-ring"></span>
    <span class="reticle-shockwave"></span>
    <svg id="eyeSvg" viewBox="0 0 64 64" fill="none">
      <path class="eye-outline" d="M11 32c5.7-8.7 12.7-13 21-13s15.3 4.3 21 13c-5.7 8.7-12.7 13-21 13S16.7 40.7 11 32Z" />
      <circle class="eye-iris" cx="32" cy="32" r="8.2" />
      <circle class="eye-pupil" cx="32" cy="32" r="3.3" />
      <path class="eye-mark" d="M32 10v4M32 50v4M6 32h4M54 32h4" />
    </svg>
    <span id="orbital-page" aria-hidden="true"></span>
  </div>

  <!-- Compact round 3D orbital option nodes -->
  <section id="target-panel" aria-label="Nearby interactions">
    <span id="option-count" aria-hidden="true">00</span>
    <div id="options-wrapper" role="group" aria-label="Available actions"></div>
  </section>

  <script type="module" src="js/main.js?v=1.21.0"></script>
</body>
</html>
